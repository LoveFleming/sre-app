<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PAAW Coding App — MXC 沙箱 與 Script Gate 位置</title>
<style>
  :root{color-scheme:light;
    --bg:#f8fafc;--fg:#172033;--muted:#5b6475;--line:#64748b;
    --neutral:#e2e8f0;--input:#bfdbfe;--process:#c7d2fe;--storage:#99f6e4;--external:#fde68a;--risk:#fecaca;}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  main{max-width:1180px;margin:28px auto;padding:0 20px;}
  svg{width:100%;height:auto;display:block;}
  .title{font-size:19px;font-weight:650;fill:var(--fg);}
  .colhead{font-size:13px;font-weight:650;fill:var(--muted);}
  .label{font-size:14.5px;font-weight:600;fill:var(--fg);}
  .small{font-size:11.5px;fill:var(--muted);}
  .mono{font-size:11.5px;fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .node{stroke:var(--line);stroke-width:1;}
  .neutral{fill:var(--neutral);}.input{fill:var(--input);}.process{fill:var(--process);}
  .storage{fill:var(--storage);}.external{fill:var(--external);}.risk{fill:var(--risk);}
  .edge{stroke:var(--line);stroke-width:1.5;fill:none;}
  .dash{stroke:var(--line);stroke-width:1.4;fill:none;stroke-dasharray:5 4;}
  .lane{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:6 5;opacity:.7;}
</style>
<main>

  <text class="small" x="570" y="99" text-anchor="middle">LLM function-calling 決定要呼叫哪個工具</text>

  <text class="label" x="210" y="276" text-anchor="middle">🛡 script-guard A</text>
  <text class="small" x="210" y="298" text-anchor="middle">執行入口檔攔截（AI 不可寫）</text>
  <text class="small" x="210" y="316" text-anchor="middle">git hooks / launchd / shell rc / ssh</text>

  <rect class="node process" x="40" y="360" width="340" height="56" rx="8"/>

  <rect class="node process" x="400" y="160" width="340" height="56" rx="8"/>
  <text class="label" x="570" y="193" text-anchor="middle">bash</text>

  <rect class="node external" x="400" y="248" width="340" height="64" rx="8"/>
  <text class="label" x="570" y="274" text-anchor="middle">🛡 shell-guard</text>
  <text class="small" x="570" y="296" text-anchor="middle">RU 程序範圍鐵律（不可碰 PAAW 本體）</text>

  <rect class="node external" x="400" y="344" width="340" height="76" rx="8"/>
  <text class="label" x="570" y="370" text-anchor="middle">🛡 script-guard C</text>
  <text class="small" x="570" y="391" text-anchor="middle">危險 pattern 掃描</text>
  <text class="small" x="570" y="409" text-anchor="middle">（正常 coding 零摩擦）</text>

  <rect class="node external" x="430" y="452" width="280" height="72" rx="8"/>
  <text class="label" x="570" y="478" text-anchor="middle">⏳ 審批卡 exec-approvals</text>
  <text class="small" x="570" y="500" text-anchor="middle">✅ 一次 / ♾️ 永遠 / ❌ 拒絕</text>
  <text class="small" x="570" y="518" text-anchor="middle">agent 真的暫停，等你的決定</text>

  <rect class="node process" x="400" y="556" width="340" height="56" rx="8"/>
  <text class="label" x="570" y="589" text-anchor="middle">runShell()（paaw-agent-loop）</text>

  <rect class="node input" x="400" y="644" width="340" height="80" rx="8"/>
  <text class="label" x="570" y="672" text-anchor="middle">⭐ MXC 沙箱</text>
  <text class="small" x="570" y="694" text-anchor="middle">execSandboxed · v4 單後端（跨平台）</text>
  <text class="small" x="570" y="712" text-anchor="middle">fs allowlist · egress deny-by-default</text>

  <rect class="node process" x="400" y="756" width="340" height="64" rx="8"/>
  <text class="label" x="570" y="782" text-anchor="middle">scanCommandOutput（輸出掃描）</text>
  <text class="small" x="570" y="803" text-anchor="middle">白名單 / 沙箱命中 → 稽核 + 通知</text>

  <rect class="node process" x="760" y="160" width="340" height="56" rx="8"/>
  <text class="label" x="930" y="193" text-anchor="middle">env_exec（npm / pip 安裝）</text>

  <rect class="node external" x="760" y="248" width="340" height="80" rx="8"/>
  <text class="label" x="930" y="276" text-anchor="middle">🛡 script-guard B</text>
  <text class="small" x="930" y="298" text-anchor="middle">npm 延遲執行防護</text>
  <text class="small" x="930" y="316" text-anchor="middle">scanScriptContent + package.json</text>

  <rect class="node input" x="760" y="360" width="340" height="80" rx="8"/>
  <text class="label" x="930" y="388" text-anchor="middle">⭐ MXC 沙箱</text>
  <text class="small" x="930" y="410" text-anchor="middle">egress 白名單</text>
  <text class="small" x="930" y="428" text-anchor="middle">npm / pip / git</text>

  <rect class="node storage" x="40" y="480" width="340" height="76" rx="8"/>
  <text class="label" x="210" y="508" text-anchor="middle">🔴 稽核 audit-log</text>
  <text class="small" x="210" y="530" text-anchor="middle">script_guard / approval / network</text>
  <text class="small" x="210" y="548" text-anchor="middle">→ ES paaw-audit-*（可事後追）</text>

  <rect class="node risk" x="760" y="480" width="340" height="76" rx="8"/>
  <text class="label" x="930" y="508" text-anchor="middle">🛠 開發模式（security-mode）</text>
  <text class="small" x="930" y="530" text-anchor="middle">總開關：略過審批 + 沙箱</text>
  <text class="small" x="930" y="548" text-anchor="middle">影響 script-guard C / 審批 / MXC</text>

  <text class="small" x="400" y="845">MXC 不可用（未裝 / 開發模式 / PAAW_SANDBOX=off）→ 退回原樣執行（proc-ledger），pattern 掃描仍在</text>
  <text class="small" x="400" y="866">逃生口：PAAW_SANDBOX=off（debug）· ⛔ 通用 shell 一律經這條鏈，沒有繞道</text>
